<template name="magicLinkModal">
  <div class="modal fade" id="magicLinkModal" tabindex="-1" aria-labelledby="magicLinkModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="magicLinkModalLabel">Sign In / Register</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          {{#if codeSent}}
          <p>We sent a 6-digit verification code to <strong>{{email}}</strong>.</p>
          <form id="verify-code-form">
            <div class="mb-3">
              <label for="verify_code" class="form-label"><i class="material-icons align-middle me-1">lock</i>6-Digit Code</label>
              <input class="form-control text-center fw-bold fs-4" id="verify_code" type="text" maxlength="6" style="letter-spacing: 8px;" required>
            </div>
            <div class="text-center mb-3">
              <button class="btn btn-purple text-white w-100" type="submit" disabled="{{isSending}}">
                {{#if isSending}}Verifying...{{else}}Verify Code <i class="material-icons align-middle ms-1">check</i>{{/if}}
              </button>
            </div>
            <div class="d-flex justify-content-between align-items-center">
              <button class="btn btn-link text-decoration-none btn-sm p-0 text-muted" id="btn-change-email" type="button">
                ← Use different email
              </button>
              <button class="btn btn-link text-decoration-none btn-sm p-0 text-muted" id="btn-resend-code" type="button" disabled="{{#if codeCooldown}}disabled{{/if}}">
                {{#if codeCooldown}}Resend code ({{codeCooldown}}s){{else}}Resend code{{/if}}
              </button>
            </div>
          </form>
          {{else}}
          <p>Enter your email address to receive a login code or magic link. No password required!</p>
          <form id="magic-link-form">
            <div class="mb-3">
              <label for="magic_email" class="form-label"><i class="material-icons align-middle me-1">email</i>Email</label>
              <input class="form-control" id="magic_email" type="email" required>
            </div>
            <div class="d-flex justify-content-center gap-2">
              <button class="btn btn-purple text-white" type="submit" disabled="{{#if codeCooldown}}disabled{{/if}}">
                {{#if codeCooldown}}Email Login Code ({{codeCooldown}}s){{else}}Email Login Code <i class="material-icons align-middle ms-1">vpn_key</i>{{/if}}
              </button>
              <button class="btn btn-outline-purple" id="btn-magic-link" type="button" disabled="{{#if magicCooldown}}disabled{{/if}}">
                {{#if magicCooldown}}Magic Link ({{magicCooldown}}s){{else}}Send Magic Link <i class="material-icons align-middle ms-1">send</i>{{/if}}
              </button>
            </div>
          </form>
          {{/if}}
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        </div>
      </div>
    </div>
  </div>
</template>
